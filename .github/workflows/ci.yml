name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install linters
        run: pip install ruff cython-lint
      - name: ruff
        run: |
          ruff check
          ruff format --check
      - name: cython-lint
        run: cython-lint --max-line-length 79 src/disvis/libdisvis.pyx

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev]'
      - name: unit tests (GPU tests are skipped)
        run: python -W error -m unittest -v

  test-cases:
    # The coarse test cases, compared byte for byte with the CPU references.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install
        run: pip install .
      - name: PRE5-PUP2 and RNA polymerase II, coarse
        shell: bash
        run: |
          status=0
          run() {  # directory receptor ligand
            cd "$GITHUB_WORKSPACE/test-cases/$1"
            disvis "$2" "$3" restraints.dat -a 9.72 -vs 2 -p 4 -d coarse > /dev/null
            tail -1 coarse/disvis.log
            for f in accessible_complexes.out violations.out z-score.out \
                     accessible_interaction_space.mrc; do
              if cmp -s "coarse/$f" "example-results/cpu/coarse/$f"; then
                echo "  $f: identical to the reference"
              else
                echo "::error::$1: $f differs from the CPU reference"
                status=1
              fi
            done
          }
          run PRE5-PUP2-complex O14250.pdb Q9UT97.pdb
          run RNA-polymerase-II/A-E 1wcm_A.pdb 1wcm_E.pdb
          exit $status

  opencl-pocl:
    # The GPU code on the CPU, with the pocl OpenCL implementation.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: install OpenCL headers and loader (to build pyvkfft)
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev
      - name: install
        run: pip install -e '.[dev,gpu]' 'pyopencl[pocl]'
      - name: OpenCL devices
        run: python -c "import pyopencl as cl; print([(p.name, [d.name for d in p.get_devices()]) for p in cl.get_platforms()])"
      - name: unit tests, including the GPU tests on pocl
        run: python -W error -m unittest -v
      - name: PRE5-PUP2 coarse with -g on pocl, compared with the GPU reference
        shell: bash
        run: |
          cd test-cases/PRE5-PUP2-complex
          disvis O14250.pdb Q9UT97.pdb restraints.dat -a 9.72 -vs 2 -g -d pocl > /dev/null
          grep -E "OpenCL device|passed" pocl/disvis.log
          python - <<'PY'
          import numpy as np
          ref = np.loadtxt('example-results/gpu/coarse/accessible_complexes.out')
          new = np.loadtxt('pocl/accessible_complexes.out')
          rel = np.abs(new[:, 1] - ref[:, 1]) / np.maximum(ref[:, 1], 1)
          z_ref = np.loadtxt('example-results/gpu/coarse/z-score.out')
          z_new = np.loadtxt('pocl/z-score.out')
          dz = np.abs(z_new - z_ref).max()
          print(f'max relative difference with the GPU reference: {rel.max():.1e}')
          print(f'max z-score difference: {dz:.1e}')
          assert rel.max() < 1e-4 and dz < 1e-3
          PY
