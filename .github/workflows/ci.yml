name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel the runs of an older commit when a new one is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether the code has to be tested: everything but the *.md files
  # counts as code. A pull request that changes only *.md files skips the
  # jobs; every other push to a pull request, and every push to main, is
  # tested.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ github.event_name != 'pull_request' || steps.filter.outputs.code == 'true' }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          # a file is code when it matches every pattern, i.e. is not a *.md
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!**/*.md'

  lint:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install linters
        run: pip install ruff cython-lint
      - name: ruff
        run: |
          ruff check
          ruff format --check
      - name: cython-lint
        run: cython-lint --max-line-length 79 src/disvis/libdisvis.pyx

  test:
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: pip install -e '.[dev]'
      - name: unit tests (the GPU tests are skipped)
        run: python -W error -m unittest -v

  test-cases:
    # The coarse test cases, compared byte for byte with the CPU references.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install
        run: pip install .
      - name: coarse test cases
        run: python test-cases/check_test_cases.py -p 4

  opencl-pocl:
    # The GPU unit tests on the CPU, with the pocl OpenCL implementation.
    # pocl is slow, so the test cases are not run with it.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    env:
      # pocl's LLVM may not know the CPU of the runner (e.g. AMD EPYC 9V45)
      # and then fails with "unknown target CPU 'generic'": compile for a
      # CPU level that all runners support.
      POCL_LLVM_CPU_NAME: x86-64-v3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: install the OpenCL headers and loader (for pyvkfft)
        run: |
          sudo apt-get update
          sudo apt-get install -y opencl-headers ocl-icd-opencl-dev
      - name: install
        run: pip install -e '.[dev,gpu]' 'pyopencl[pocl]'
      - name: OpenCL devices
        run: python -c "import pyopencl as cl; print([(p.name, [d.name for d in p.get_devices()]) for p in cl.get_platforms()])"
      - name: unit tests, with the GPU tests on pocl
        run: python -W error -m unittest -v

  ci-passed:
    # One check for the branch ruleset, independent of the job matrix.
    if: always()
    needs: [changes, lint, test, test-cases, opencl-pocl]
    runs-on: ubuntu-latest
    steps:
      - name: all jobs passed
        run: |
          echo 'lint: ${{ needs.lint.result }}, test: ${{ needs.test.result }}, test-cases: ${{ needs.test-cases.result }}, opencl-pocl: ${{ needs.opencl-pocl.result }}'
          test '${{ needs.changes.result }}' = success
          if [ '${{ needs.changes.outputs.code }}' = false ]; then
            echo 'The pull request changes only *.md files.'
            exit 0
          fi
          test '${{ needs.lint.result }}' = success
          test '${{ needs.test.result }}' = success
          test '${{ needs.test-cases.result }}' = success
          test '${{ needs.opencl-pocl.result }}' = success
