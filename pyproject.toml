[build-system]
requires = ["setuptools>=61", "wheel", "numpy", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["test-cases"]

[tool.ruff.lint]
select = ["E", "W", "F", "D", "B", "UP", "PL"]
ignore = [
    "D107",     # __init__ arguments are documented in the class docstring
    "D203",     # conflicts with D211 (no blank line before class docstring)
    "D213",     # conflicts with D212 (summary on the first line)
    "UP031",    # the code uses str.format throughout
    "UP032",
    "PLR0911",  # design-size limits
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLC0415",  # GPU modules are imported only with -g
    "PLR2004",  # numeric constants in scientific code
]

[tool.ruff.lint.per-file-ignores]
"disvis/elements.py" = ["D", "UP", "PL", "B"]  # third-party code
"disvis/tests/*" = ["D"]

[tool.ruff.format]
quote-style = "preserve"
exclude = ["disvis/elements.py"]  # third-party code, kept as is
