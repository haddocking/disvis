[build-system]
requires = ["setuptools>=77", "numpy", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disvis"
version = "3.0.0"
description = """\
Quantifying and visualizing the interaction space of distance-constrained \
macromolecular complexes"""
readme = "README.md"
authors = [{ name = "Gydo C.P. van Zundert", email = "gvanzundert51@gmail.com" }]
maintainers = [{ name = "BonvinLab", email = "bonvinlab.support@uu.nl" }]
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy",
    "pyfftw",  # roughly halves the run time compared with the NumPy FFT
]

[project.optional-dependencies]
# GPU acceleration; pyvkfft is built from source (see INSTALLATION.md).
gpu = ["pyopencl", "mako", "pyvkfft"]
dev = ["ruff", "cython-lint"]

[project.urls]
homepage = "https://github.com/haddocking/disvis"
source = "https://github.com/haddocking/disvis"
issues = "https://github.com/haddocking/disvis/issues"

[project.scripts]
disvis = "disvis.main:main"

# The compiled extensions are defined in setup.py, as they need
# numpy.get_include() and cythonize().

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
disvis = ["data/*.npy", "kernels.cl"]

[tool.setuptools.exclude-package-data]
# Sources of the compiled extensions: in the sdist, not in the wheel
disvis = ["*.pyx", "*.c"]

[tool.ruff]
line-length = 79
target-version = "py311"
extend-exclude = ["test-cases"]

[tool.ruff.lint]
select = ["E", "W", "F", "D", "B", "UP", "PL", "C90"]
ignore = [
    "D107",     # __init__ arguments are documented in the class docstring
    "D203",     # conflicts with D211 (no blank line before class docstring)
    "D213",     # conflicts with D212 (summary on the first line)
    "UP031",    # the code uses str.format throughout
    "UP032",
    "PLR0911",  # design-size limits
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLC0415",  # GPU modules are imported only with -g
    "PLR2004",  # numeric constants in scientific code
]

[tool.ruff.lint.per-file-ignores]
"src/disvis/elements.py" = ["D", "UP", "PL", "B", "C90"]  # third-party code
"tests/*" = ["D"]

[tool.ruff.lint.mccabe]
# Functions above this complexity are marked with noqa: C901 until refactored.
max-complexity = 10

[tool.ruff.format]
quote-style = "preserve"
exclude = ["src/disvis/elements.py"]  # third-party code, kept as is
