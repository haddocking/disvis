pydocstyle:
  run: true
  disable:
    - D203   # conflicts with D211 (no blank line before class docstring)
    - D213   # conflicts with D212 (summary on the first line)

pylint:
  disable:
    - consider-using-f-string      # the code uses str.format throughout
    - too-many-locals
    - too-many-arguments
    - too-many-positional-arguments
    - too-many-instance-attributes
    - too-few-public-methods
    - import-outside-toplevel      # GPU modules are imported only with -g
