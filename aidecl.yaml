# See https://ai-declaration.org/ for more information.
schema_version: 1.0.0
project:
  name: disvis
  repository: https://github.com/haddocking/disvis.git
  content_type: software
  license: Apache-2.0
ai_usage:
  used: true
  summary: >-
    Claude Code was used for the Python 3 port (v3.0.0) and the later
    changes, always reviewed by a human; GitHub Copilot reviewed pull
    requests.
  level: significant
  scope:
    code_completion: false
    code_review: true
    code_generation: true
    documentation: true
    refactoring: true
  tools:
    - name: Claude Code
      type: agent
      hosting: cloud_vendor
      purpose:
        - agent in the terminal
        - porting, testing, benchmarking and documenting the code
    - name: GitHub Copilot
      type: agent
      hosting: cloud_vendor
      purpose:
        - code review on GitHub
declaration:
  date: '2026-10-26'
  declared_by: amjjbonvin
